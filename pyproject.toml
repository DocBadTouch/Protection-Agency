[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protection-agency"
version = "0.2.0a4"
description = "Local security screening for coding agents. Your agent needs an agency."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "DocBadTouch"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "License :: OSI Approved :: MIT License",
]

[project.scripts]
protection-agency = "protection_agency.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
